defaults:
  - _self_
  - model: generator_smpl
  - sensor: dip_6imu
  - sensor/noise_profile: realistic_wearable
  - pathology: axspa_severe
  - dataset: human3.6m
  - training: gan_wgan_gp
  - logging: wandb

# Hardware & Acceleration (Optimized for NVIDIA GeForce RTX 4050 Laptop GPU)
device: "cuda:0"
gpu:
  name: "NVIDIA GeForce RTX 4050"
  precision: "16-mixed" # Use mixed precision (AMP fp16) for VRAM efficiency & speed
  benchmark_cudnn: true
  num_workers: 4
  pin_memory: truep

seed: 42
exp_name: "axspa_simimu_experiment"
output_dir: "outputs/${exp_name}/${now:%Y-%m-%d_%H-%M-%S}"
